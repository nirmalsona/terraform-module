name: Terraform_CI_CD   ##workflow name

on:   ###event trigger
 push:   ####event method
    branches:
     - main   ####source code

defaults:
	   run: 
	    working-directory: envs/dev

jobs:
    
	
	
    terraform_validation: #1:- Validation 
      name: terraform CI(download , checkout & init)    #########logical job name
      runs-on: ubuntu-latest #########runner for this job
	  
      steps:
        - name: Install terraform ###download terraform package
          uses: hashicorp/setup-terraform@v3
		  
        - name: check out the code ####Checkout the code
          uses: actions/checkout@v4
		  
		- name: Azure Login
          uses: azure/login@v2
          with:
             creds: ${{ secrets.AZURE_CREDENTIALS }}  
		  
		  
        - name: Iniliaze the terraform project ###terraform initlize
          run: terraform init
		  
        - name: formatting the code ## formatting the code
          run: terraform fmt  -check -recursive
		  
        - name: validate the codes # validates the code
          run: terraform validate
		  
			
        
    terraform_security_scan: #2:- Static code quality check
	  needs: terraform_validation
      
      name: security_scan  #########logical job name
      runs-on: ubuntu-latest  #########runner for this job
	  
      steps:
        - name: Install terraform ###download terraform package
          uses: hashicorp/setup-terraform@v3
		  
        - name: check out the code ####Checkout the code
          uses: actions/checkout@v4
		  
		- name: Azure Login
          uses: azure/login@v2
          with:
             creds: ${{ secrets.AZURE_CREDENTIALS }}  
		  
		  
			 
        - name: Iniliaze the terraform project ###terraform initlize
          run: terraform init
		  
        - name: setup tflint ## download tflint
          uses: terraform-linters/setup-tflint@v4
		  
        - name: Initiliaze TFlint ## download tflint
		  run: tflint --init
		  
        - name: scanning the  codes by tflint # scanning the code
          run: tflint
		  
        - name: setup checkov
          run: pip3 install checkov
		  
        - name: Security code scan by checkov
          run: checkov -d . --soft-fail
	
	terraform_plan_preview: #3:- Plan review 
	  
	  needs: terraform_security_scan
	  
      name: Terraform plan
      runs-on: ubuntu-latest
      steps:
       
        - name: check out the terraform configuation code
          uses: actions/checkout@v4
		
		
		- name: Terraform setup 
		  uses: hashicorp/setup-terraform@v3
		  
		 
		- name: Azure Login
          uses: azure/login@v2
          with:
             creds: ${{ secrets.AZURE_CREDENTIALS }}  
		  
		  
		 
		- name: Initiliaze the terraform project
		  run: terraform init
		  
		  
		- name: Azure Login
          uses: azure/login@v2
          with:
             creds: ${{ secrets.AZURE_CREDENTIALS }}  
		  
		  
		- name: preview of infraacture before deploy
		  run: terraform plan -out=tfplan -var-file="dev.tfvars"
		 
		- name: Upload terraform plan arctifact
		  uses: actions/upload-artifact@v4
		  with:
		    name: tfplan
			path: envs/dev/tfplan
		  
	terraform_apply: # 4:- finally deployent
	   needs: terraform_plan_preview
	   environment: dev
       name: Infraacture deployment by terraform apply    
       runs-on: ubuntu-latest
        steps:
		
		 - name: check out the terraform configuation code
           uses: actions/checkout@v4
		  
		  
		 - name: Azure Login
           uses: azure/login@v2
           with:
             creds: ${{ secrets.AZURE_CREDENTIALS }}  
		  
		
		
		 - name: Terraform setup 
		   uses: hashicorp/setup-terraform@v3
		  
		 
		 - name: Initiliaze the terraform project
		  run: terraform init
		  
		 - name: Download artifact
		   uses: actions/download-artifact@v4
		   with:
		     name: tfplan
			 path: envs/dev
			
			
	     - name: Azure Login
           uses: azure/login@v2
           with:
             creds: ${{ secrets.AZURE_CREDENTIALS }}
			 
	     - name: Finally terraform apply
		   run: terraform apply  -auto-approve tfplan
			  
			 
